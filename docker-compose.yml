# Smart Travel Planner — full-stack Docker service.
#
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# The image builds the React SPA and serves it from FastAPI on one origin.
# Secrets stay in backend/.env locally and in Render environment variables in
# production; they are never copied into the image.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-travel-planner
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # The container always serves the built SPA from this path.
      FRONTEND_DIST_PATH: /app/frontend/dist
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
