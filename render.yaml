# Render.com blueprint — full-stack single service.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# The Dockerfile builds the React SPA and serves it from FastAPI on one origin.
#
# Production validation requires DATABASE_URL, NEON_AUTH_BASE_URL,
# NEON_AUTH_JWKS_URL and explicit CORS/host values. Set the `sync: false`
# variables in the Render dashboard (never commit them). Google Maps,
# OpenWeather and AI keys are optional: the app still boots, search falls back
# to the curated catalog, and itinerary generation uses the deterministic
# planner when AI providers are unavailable.

services:
  - type: web
    name: smart-travel-planner
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: FRONTEND_DIST_PATH
        value: /app/frontend/dist
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_AUTH_ORIGIN
        sync: false
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-4-fast-non-reasoning
      - key: AI_PROVIDER_ORDER
        value: gemini,grok
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URL
        sync: false
